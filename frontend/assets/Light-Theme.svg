  <!-- Flowing background blob -->
  <path d="M 22 50 C 22 25, 45 15, 70 25 C 95 35, 90 75, 65 85 C 40 95, 22 75, 22 50 Z" fill="url(#gradTaskFlow)" opacity="0.15" />
  
  <!-- Checkmark -->
