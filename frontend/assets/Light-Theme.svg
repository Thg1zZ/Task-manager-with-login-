  <!-- Task Lines -->
  <rect x="25" y="22" width="22" height="8" rx="4" fill="#334155" />
  <rect x="25" y="78" width="40" height="8" rx="4" fill="#334155" />
  <circle cx="75" cy="82" r="4" fill="#3b82f6" />
